name: Prepare first migration and lockfile

# Temporary release-preparation job. The branch-scoped trigger prevents
# generating or applying migrations on main/production.
on:
  push:
    branches:
      - chore/crj-release-readiness

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate initial migration from schema (NO database required)
        run: |
          mkdir -p prisma/migrations/0_init
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output prisma/migrations/0_init/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          test -s prisma/migrations/0_init/migration.sql
      - name: Commit generated artifacts to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json prisma/migrations/0_init/migration.sql prisma/migrations/migration_lock.toml
          if ! git diff --cached --quiet; then
            git commit -m "build: commit npm lockfile and Prisma initial migration"
            git push origin HEAD:chore/crj-release-readiness
          fi
