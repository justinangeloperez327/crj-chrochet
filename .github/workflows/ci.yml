name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Use npm with install-script policy
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Verify initial migration is committed
        run: |
          test -s prisma/migrations/0_init/migration.sql
          test -f prisma/migrations/migration_lock.toml
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crj_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crj_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crj_test
      ADMIN_EMAIL: ci-admin@example.invalid
      ADMIN_PASSWORD: ci-only-not-for-production-2026
      ADMIN_NAME: CI Admin
      ALLOW_DEMO_SEED: "true"
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Use npm with install-script policy
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Apply real SQL migrations to disposable PostgreSQL
        run: npm run db:deploy
      - name: Seed and bootstrap admin
        run: |
          npm run db:seed
          npm run db:bootstrap-admin
      - name: Test verified guest claiming and single-use recovery
        run: npm run test:integration
      - name: Check migrated schema matches Prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Build with PostgreSQL
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm run test:e2e
